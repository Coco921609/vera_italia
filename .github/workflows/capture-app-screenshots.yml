name: Capture real app screens

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"

permissions:
  contents: write

concurrency:
  group: vera-italia-app-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter screenshot version
        run: |
          flutter pub get
          flutter build web --release --base-href "/" -t tool/screenshot_harness.dart

      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright http-server
          npx playwright install --with-deps chromium

      - name: Capture the real Flutter screens
        run: |
          mkdir -p docs/screenshots
          npx http-server build/web -p 4173 -c-1 > /tmp/vera-italia-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          const BASE = 'http://127.0.0.1:4173/?screen=';
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 430, height: 932 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              reducedMotion: 'reduce'
            });

            const capture = async (screen, filename) => {
              const page = await context.newPage();
              await page.goto(BASE + screen, { waitUntil: 'networkidle' });
              await wait(3200);
              await page.screenshot({
                path: `docs/screenshots/${filename}.png`,
                fullPage: false,
                animations: 'disabled'
              });
              console.log('Captured 430x932 screen:', screen, '->', filename);
              await page.close();
            };

          await capture('welcome', '01-accueil');
          await capture('explore', '02-exploration');
          await capture('resia', '03-lac-de-resia');
          await capture('dolomites', '04-dolomites');
          await capture('bomarzo', '05-parc-de-bomarzo');
          await capture('frasassi', '06-grottes-de-frasassi');
          await capture('val-dorcia', '07-val-dorcia');
          await capture('civita', '08-civita-di-bagnoregio');
          await capture('ninfa', '09-jardin-de-ninfa');
          await capture('rocca-calascio', '10-rocca-calascio');
          await capture('tarocchi', '11-giardino-dei-tarocchi');
          await capture('san-fele', '12-chutes-de-san-fele');
          await capture('lugano', '13-lugano');
          await capture('furore', '14-furore');
          await capture('tremiti', '15-iles-tremiti');
          await capture('alberobello', '16-alberobello');
          await capture('castellana', '17-grottes-de-castellana');
          await capture('ischia', '18-ischia');
          await capture('margherita', '19-margherita-di-savoia');
          await capture('mangiapane', '20-grotte-mangiapane');
          await capture('scala', '21-scala-dei-turchi');
          await capture('sicily', '22-sicile-volcanique');

            await context.close();
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify all screenshots exist and are distinct
        run: |
          expected=(
            01-accueil
            02-exploration
            03-lac-de-resia
            04-dolomites
            05-parc-de-bomarzo
            06-grottes-de-frasassi
            07-val-dorcia
            08-civita-di-bagnoregio
            09-jardin-de-ninfa
            10-rocca-calascio
            11-giardino-dei-tarocchi
            12-chutes-de-san-fele
            13-lugano
            14-furore
            15-iles-tremiti
            16-alberobello
            17-grottes-de-castellana
            18-ischia
            19-margherita-di-savoia
            20-grotte-mangiapane
            21-scala-dei-turchi
            22-sicile-volcanique
          )
          for name in "${expected[@]}"; do
            test -s "docs/screenshots/$name.png" || {
              echo "Missing screenshot: $name.png"
              exit 1
            }
          done

          declare -A hashes
          for name in "${expected[@]}"; do
            hash=$(sha256sum "docs/screenshots/$name.png" | cut -d ' ' -f 1)
            if [[ -n "${hashes[$hash]:-}" ]]; then
              echo "Duplicate screenshot: $name.png matches ${hashes[$hash]}.png"
              exit 1
            fi
            hashes[$hash]="$name"
          done

          echo "Verified ${#expected[@]} distinct mobile screenshots (430x932)."
          ls -lh docs/screenshots/*.png

      - name: Commit screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: refresh real Flutter app screenshots"
          file_pattern: "docs/screenshots/*.png"
